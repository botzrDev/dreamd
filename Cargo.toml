[workspace]
resolver = "2"
members = [
    "crates/dreamd-core",
    "crates/dreamd-cli",
    "crates/dreamd-protocol",
]

[workspace.package]
# 1.2.0. Windows dream cycle and Tantivy index. Recall is still BM25 × salience. There is no 1.1.0 tag.
version = "1.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/botzrDev/dreamd"
authors = ["Austin Green <austin@botzr.com>"]
readme = "README.md"

[workspace.lints.rust]
# dreamd handles user data and secrets (auth.json, AGENT_LEARNINGS.jsonl);
# unsafe code is forbidden project-wide to eliminate an entire class of
# memory-safety bugs from the codebase.
unsafe_code = "forbid"

[workspace.dependencies]
# Shared across crates for snapshot testing (WEG-20). The "filters" feature
# enables redaction of build-specific values (SHA, date, target triple).
insta = { version = "1", features = ["filters"] }
# MCP SDK — server-side tooling + stdin/stdout transport for `dreamd mcp` (WEG-77).
# Implements MCP spec 2025-11-25. `"1.7.0"` is a caret requirement (>= 1.7.0,
# < 2); dreamd-core's `mcp` module is the consumer.
rmcp = { version = "1.7.0", features = ["server", "transport-io"] }

# Fat LTO and one codegen unit keep the stripped `dreamd` under the NFR-2 size
# gate (`MAX_BYTES` in ci.yml); the default profile measured about 20.5 MB
# (AILAB-196).
[profile.release]
lto = "fat"
codegen-units = 1
