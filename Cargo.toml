[workspace]
resolver = "2"
members = [
    "crates/dreamd-core",
    "crates/dreamd-cli",
    "crates/dreamd-protocol",
]

[workspace.package]
# 1.4.1. Patch: daemon-mode project paths that end in a space or tab are refused, an installed service survives `update`, and the npm shim stops dreamd when npm's shell dies. 1.4.0 was the hardening release: recall takes any text in one order with a k limit, per-project config and redaction, per-vendor API keys, dream cycles that keep hand edits and commit only on a branch, client deadlines and a version check, and a setup that keeps AGENTS.md loaded. Recall is still BM25 × salience.
version = "1.4.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/botzrDev/dreamd"
homepage = "https://github.com/botzrDev/dreamd"
# CI and rust-toolchain.toml pin the same compiler. cargo install refuses
# an older rustc instead of failing deep in a dependency.
rust-version = "1.95.0"
authors = ["Austin Green <austin@botzr.com>"]

[workspace.lints.rust]
# dreamd handles user data and secrets (auth.json, AGENT_LEARNINGS.jsonl);
# unsafe code is forbidden project-wide to eliminate an entire class of
# memory-safety bugs from the codebase.
unsafe_code = "forbid"

[workspace.dependencies]
# Shared across crates for snapshot testing (WEG-20). The "filters" feature
# enables redaction of build-specific values (SHA, date, target triple).
insta = { version = "1", features = ["filters"] }
# MCP SDK — server-side tooling + stdin/stdout transport for `dreamd mcp` (WEG-77).
# Implements MCP spec 2025-11-25. `"1.7.0"` is a caret requirement (>= 1.7.0,
# < 2); dreamd-core's `mcp` module is the consumer.
rmcp = { version = "1.7.0", features = ["server", "transport-io"] }

# Fat LTO and one codegen unit keep the stripped `dreamd` under the NFR-2 size
# gate (`MAX_BYTES` in ci.yml); the default profile measured about 20.5 MB
# (AILAB-196).
[profile.release]
lto = "fat"
codegen-units = 1
