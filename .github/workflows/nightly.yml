name: Nightly

on:
  schedule:
    # 06:00 UTC daily — separate from PR CI to keep merge cycle time low.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  episodic-proptest:
    name: Property tests (episodic scan, salience, protocol round-trip)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@1961bfc0c4a8bf07e0a0c98e1e2459c642ea70a0 # 1.95.0

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-nightly-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-nightly-

      - name: Run episodic scan proptest (1024 cases)
        env:
          PROPTEST_CASES: "1024"
        run: cargo test -p dreamd-core --test episodic_scan_proptest

      - name: Run salience proptest (1024 cases)
        env:
          PROPTEST_CASES: "1024"
        run: cargo test -p dreamd-core --test salience_proptest

      - name: Run protocol JSONL roundtrip proptest (1024 cases)
        env:
          PROPTEST_CASES: "1024"
        run: cargo test -p dreamd-protocol --test roundtrip_proptest

      - name: Run edge proptest (256 cases)
        env:
          PROPTEST_CASES: "256"
        run: cargo test -p dreamd-core --test edge_proptest
