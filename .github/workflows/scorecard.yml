name: Scorecard

# OpenSSF Scorecard: scores the repository's supply-chain practices (pinned
# dependencies, token permissions, branch protection, signed releases and
# more) and publishes the result to the public Scorecard API, which backs the
# README badge. Findings also appear in the Security tab.
#
# Publishing only accepts a workflow that keeps to the Scorecard rules: no
# top-level write permissions, no workflow-level env or defaults, and only
# the steps below. Do not add steps to this job.

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: "43 5 * * 1"   # weekly, Monday 05:43 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # upload the SARIF to code scanning
      id-token: write         # sign the published results
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Keep the SARIF as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: results.sarif
