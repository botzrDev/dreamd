name: MCP manifest

# Pre-release helper: build shim-target tarballs and regenerate
# packages/dreamd-mcp/manifest.json. The release workflow is the path that
# fills shas for a tag; this dispatch is the manual rerun.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver for manifest.json (no leading v)"
        required: true
        default: "1.0.0"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The shim's linux-x86_64 is the static musl build, as in
          # release.yml (BZR-1438).
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact_name: dreamd
            asset_name: linux-x86_64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: dreamd
            asset_name: darwin-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: dreamd
            asset_name: darwin-aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@1961bfc0c4a8bf07e0a0c98e1e2459c642ea70a0 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux musl only)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-mcp-manifest-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-mcp-manifest-

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip and package
        shell: bash
        run: |
          BINARY=target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          strip "$BINARY"
          tar -czf "${{ matrix.asset_name }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" \
            "${{ matrix.artifact_name }}"

      - name: Upload tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset_name }}.tar.gz
          path: ${{ matrix.asset_name }}.tar.gz
          if-no-files-found: error

  manifest:
    name: Generate manifest.json
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/

      - name: Regenerate manifest.json
        run: |
          chmod +x scripts/update-mcp-manifest.sh
          scripts/update-mcp-manifest.sh "${{ inputs.version }}" dist
          cat packages/dreamd-mcp/manifest.json

      - name: Upload manifest artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-manifest
          path: packages/dreamd-mcp/manifest.json
          if-no-files-found: error
