[package]
name = "dreamd-protocol"
description = "Shared serde types for the dreamd HTTP API and on-disk JSONL records."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# Protocol owns the parse/validate boundary only, so its runtime deps stay
# serde + chrono. ULID minting lives in dreamd-core, and a new runtime dep here
# would reach every consumer of these types.
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
# serde_json is dev-only: protocol defines the shape, not the codec.
# Production serialization happens in dreamd-core's coordinator.
serde_json = "1"
# proptest is test-only (JSONL round-trip property suite, WEG-159). It does not
# relax the runtime dep policy above: runtime deps stay serde + chrono.
# Pinned to major 1; its `rand 0.9` chain already resolves in Cargo.lock, so it
# adds no parallel-major.
proptest = "1"
