# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[licenses]
# Licenses that are allowed for all dependencies.
# dreamd is Apache-2.0; these permissive licenses are compatible.
# (No `unmatched` key: current cargo-deny rejects it as unknown, and
# deny-by-default for any license outside `allow` is exactly the intent.)
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    # Transitive dependencies from the chrono/icu dependency chains.
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
]

# Per-crate license exceptions (reviewed; deliberately not in the global allow
# list so each stays auditable). option-ext (transitive via dirs → dirs-sys,
# used for ~/.agent path resolution) is MPL-2.0 — OSI-approved weak, file-level
# copyleft. As an unmodified linked dependency it imposes no copyleft on
# dreamd's Apache-2.0 code; MPL obligations are per-file and trigger only on
# modifying the MPL-licensed source itself, which dreamd does not do.
exceptions = [
    { name = "option-ext", allow = ["MPL-2.0"] },
    # AILAB-204 — webpki-root-certs is the Mozilla CA root-certificate bundle,
    # reached via genai -> reqwest -> rustls-platform-verifier. CDLA-Permissive-2.0
    # is the Linux Foundation's permissive *data* license: it grants unrestricted
    # use/modification/redistribution of the data and imposes no obligation on the
    # code that links it, so it does not reach dreamd's Apache-2.0 source. Scoped
    # to this crate deliberately: any other CDLA-licensed dependency still fails
    # the gate and gets its own review. Reviewed 2026-08-22.
    # Removable if genai ever exposes a root store under an allow-listed license.
    { name = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
]

# Reject any dependency whose license is not in the allow list above.
# (cargo-deny now denies unlicensed and copyleft dependencies by default)

[bans]
# Warn (not fail) when the graph holds several versions of one crate.
multiple-versions = "warn"
# Deny wildcard dependencies. (Internal path deps each carry an explicit
# `version` — required for crates.io publish — so they are not wildcards.)
wildcards = "deny"

[advisories]
# Deny crates with known security vulnerabilities (workspace + transitive).
# (cargo-deny now denies vulnerabilities by default)
unmaintained = "workspace"
yanked = "deny"

# No per-advisory `ignore` entries. When adding one, give its RUSTSEC id and
# crate version, why the risk is accepted, and when it is due for removal.

[sources]
# Only crates.io: any other registry or git source fails the check.
unknown-registry = "deny"
unknown-git = "deny"
